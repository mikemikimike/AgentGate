[project]
name = "agentgate-decision"
version = "0.1.0"
description = "AgentGate Decision Server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "unsloth",
    "torch",
    "transformers",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "httpx>=0.25.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
