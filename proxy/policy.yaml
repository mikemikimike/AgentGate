version: 1
defaults:
  on_model_error: ask
  abstain:
    heads:
      - untrusted_influence
      - goal_alignment
    max_prob_below: 0.40
tools:
  "bash":
    rules:
      - id: block-prompt-injection
        when:
          head: untrusted_influence
          option: likely
          gt: 0.45
        action: deny
        reason: "Untrusted prompt influence exceeds safety threshold."
      - id: allow-safe-reads
        when:
          all:
            - effect: read
            - head: untrusted_influence
              option: likely
              lt: 0.40
        action: allow
        reason: "Autonomous read command with low untrusted influence."
      - id: checkpoint-writes
        when:
          all:
            - effect: write
            - head: untrusted_influence
              option: likely
              lt: 0.40
        action: allow_with_checkpoint
        reason: "Modifying command auto-snapshotted with instant undo capability."
    default: ask

  "bash_exec":
    rules:
      - id: block-injected-shell
        when:
          head: untrusted_influence
          option: likely
          gt: 0.45
        action: deny
        reason: "Untrusted prompt influence detected on shell execution."
      - id: allow-safe-shell-reads
        when:
          all:
            - effect: read
            - head: untrusted_influence
              option: likely
              lt: 0.40
        action: allow
        reason: "Autonomous read command with low untrusted influence."
      - id: checkpoint-shell-writes
        when:
          all:
            - effect: write
            - head: untrusted_influence
              option: likely
              lt: 0.40
        action: allow_with_checkpoint
        reason: "Modifying shell command auto-snapshotted."
      - id: block-destructive-command
        when:
          head: reversibility
          option: irreversible
          gt: 0.50
        action: ask
        reason: "Irreversible shell command requires operator review."
    default: ask

  "mail_send":
    rules:
      - id: block-exfiltration-send
        when:
          any:
            - { head: untrusted_influence, option: likely, gt: 0.45 }
            - { head: external_send, option: "yes", gt: 0.45 }
        action: deny
        reason: "External data exfiltration or prompt injection detected."
    default: ask

  "send_*":
    rules:
      - id: block-injected-send
        when:
          head: untrusted_influence
          option: likely
          gt: 0.45
        action: deny
        reason: "Prompt injection detected; blocking external transmission."
    default: ask

  "file_edit":
    rules:
      - id: block-system-mutation
        when:
          head: untrusted_influence
          option: likely
          gt: 0.45
        action: deny
        reason: "Critical file mutation under untrusted context."
      - id: checkpoint-file-edit
        when:
          head: untrusted_influence
          option: likely
          lt: 0.40
        action: allow_with_checkpoint
        reason: "File modification auto-checkpointed for safe autonomous editing."
    default: ask

  "database_query":
    rules:
      - id: block-injected-db
        when:
          head: untrusted_influence
          option: likely
          gt: 0.50
        action: deny
        reason: "Untrusted database query injection."
    default: allow

  "file_read":
    default: allow

  "read_file":
    default: allow

  "*":
    default: ask
