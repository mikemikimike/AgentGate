services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: agentgate
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d agentgate"]
      interval: 5s
      timeout: 5s
      retries: 5

  decision:
    build:
      context: ./decision
      dockerfile: Dockerfile
    environment:
      - USE_UNSLOTH=1
      - DECISION_MODEL_PATH=${DECISION_MODEL_PATH:-codeload/agentgate-qwen-0.8b}
    # Uncomment to enable GPU usage for Unsloth:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:9000/health')\""]
      interval: 5s
      timeout: 5s
      retries: 5

  proxy:
    build:
      context: ./proxy
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgresql://user:pass@postgres:5432/agentgate
      - AG_DB_URL=postgresql://user:pass@postgres:5432/agentgate
      - AG_DECISION_URL=http://172.20.0.1:9000
      - AG_DECISION_DEADLINE_MS=30000
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/metrics"]
      interval: 5s
      timeout: 5s
      retries: 5

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://proxy:8080
    volumes:
      - ./dashboard:/app
      - /app/node_modules
    depends_on:
      - proxy
