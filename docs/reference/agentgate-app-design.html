 <h2>Verdicts</h2><p><span class="vd allow"><i></i>Allow</span> &nbsp; The call goes to the tool.</p><p><span class="vd ask"><i></i>Review</span> &nbsp; The call waits in Approvals until a person decides. Timeouts deny.</p><p><span class="vd deny"><i></i>Block</span> &nbsp; The call never reaches the tool. The agent gets a reason code.</p>
 <h2>Policy file</h2><p>Rules compare probabilities to thresholds. The strictest matching action wins.</p>${cb('tools:\n  send_email:\n    rules:\n      - id: deny-injected-exfil\n        when:\n          all:\n            - { head: untrusted_influence, option: likely, gt: 0.30 }\n            - { head: external_send, option: "yes", gt: 0.50 }\n        action: deny')}
 <h2>API</h2><p>Check a call before running it.</p>${cb('POST /v1/assess\n{ "session_id": "s_123", "action": { "tool": "send_email", "arguments": { "to": "x@evil.com" } } }')}</div></div>`;
 document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>{try{navigator.clipboard.writeText(b.parentElement.innerText.replace(/Copy$/,'').trim())}catch(e){}toast('Copied')})}
function route(){const h=location.hash.replace(/^#\//,'')||'audit',[p,a]=h.split('/');navr(p==='decision'?'audit':p);({audit,decision:()=>detail(a),approvals,policy,models,docs}[p]||audit)();}
addEventListener('hashchange',route);
document.addEventListener('click',e=>{const t=e.target.closest('[data-toast]');if(t){e.preventDefault();toast(t.dataset.toast)}});
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;const h=location.hash;
 if(h.startsWith('#/decision/')){const i=DEC.indexOf(cur)+(e.key==='j'?1:e.key==='k'?-1:0);if((e.key==='j'||e.key==='k')&&DEC[i])location.hash='#/decision/'+DEC[i].id;if(e.key==='Escape')location.hash='#/audit'}
 if(h==='#/approvals'){if(e.key==='a')act('approve');if(e.key==='d')act('deny')}});
$('th').onclick=()=>{const r=document.documentElement;r.dataset.theme=r.dataset.theme==='dark'?'light':'dark'};
setInterval(()=>{AQ.forEach(a=>{if(a.sec>0)a.sec--;const e=document.querySelector(`[data-s="${a.d.id}"]`);if(e)e.textContent=mmss(a.sec)})},1000);
route();
</script>
